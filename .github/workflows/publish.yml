name: Publish

env:
  NPM_VERSION: "11.17.0"

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build release package
    environment: npmjs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Fetch sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install npm with install-script policy support
        run: npm install --global "npm@$NPM_VERSION"

      - name: Validate release tag
        run: |
          package_version=$(node -p "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $package_version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check code
        run: npm run check

      - name: Run tests
        run: npm run test:ci

      - name: Publish test summary
        if: ${{ !cancelled() && hashFiles('test-results.xml') != '' }}
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: test-results.xml
          show: fail

      - name: Build package
        run: npm run build

      - name: Pack without running lifecycle scripts again
        run: npm pack --ignore-scripts

      - name: Capture package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: "*.tgz"
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to npmjs
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npmjs
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with install-script policy support
        run: npm install --global "npm@$NPM_VERSION"

      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: package

      - name: Inspect package artifact
        run: ls -la package

      - name: Publish package to npm
        run: npm publish ./package/*.tgz --ignore-scripts --access public --tag latest
